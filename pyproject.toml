[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctions-parser"
version = "1.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "lxml>=5.2,<7",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=16,<24",
  "PyYAML>=6.0,<7",
  "questionary>=2.1,<3",
  "requests>=2.32,<3",
  "rich>=14,<15",
  "tqdm>=4.66,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]
